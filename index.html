<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop Cabinet</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
        <h1 class="text-2xl font-bold mb-4 text-center text-sky-400">Drop Cabinet</h1>
        
        <!-- Form Input -->
        <div class="mb-4">
            <textarea id="postContent" rows="3" placeholder="Tulis catatan atau drop sesuatu di sini..." 
                class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 focus:outline-none focus:border-sky-500 text-sm resize-none"></textarea>
            <button onclick="savePost()" id="saveBtn" class="mt-2 w-full bg-sky-500 hover:bg-sky-600 font-semibold py-2 rounded-xl transition duration-200">
                Kirim Postingan
            </button>
        </div>

        <hr class="border-slate-700 my-4">

        <!-- Daftar Postingan -->
        <h2 class="text-sm font-semibold text-slate-400 mb-2">Arsip Terbaru:</h2>
        <div id="postsContainer" class="space-y-3 max-h-60 overflow-y-auto pr-1">
            <p class="text-xs text-slate-500 text-center">Memuat data...</p>
        </div>
    </div>

    <script>
        // Konfigurasi Supabase dengan kunci asli
        const SUPABASE_URL = 'https://cevofxyyfvcaookqozmf.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_xCma_WLsgPLEq-NOsTuQkg_bWF7ejk7'; 

        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Fungsi mengambil data
        async function fetchPosts() {
            const container = document.getElementById('postsContainer');
            const { data, error } = await db
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<p class="text-xs text-red-400 text-center">Gagal memuat: ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center">Belum ada catatan.</p>`;
                return;
            }

            container.innerHTML = data.map(post => `
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 text-sm">
                    <p class="break-words text-slate-200">${escapeHtml(post.content || post.text || '')}</p>
                    <span class="text-[10px] text-slate-500 mt-1 block">${new Date(post.created_at).toLocaleString('id-ID')}</span>
                </div>
            `).join('');
        }

        // Fungsi menyimpan data baru
        async function savePost() {
            const input = document.getElementById('postContent');
            const btn = document.getElementById('saveBtn');
            const content = input.value.trim();

            if (!content) return;

            btn.disabled = true;
            btn.innerText = 'Mengirim...';

            const { error } = await db
                .from('posts')
                .insert([{ content: content }]);

            if (error) {
                alert('Gagal menyimpan: ' + error.message);
            } else {
                input.value = '';
                fetchPosts();
            }

            btn.disabled = false;
            btn.innerText = 'Kirim Postingan';
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        fetchPosts();
    </script>
</body>
</html>
